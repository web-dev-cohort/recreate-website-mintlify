<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 116" fill="none">
  <!-- Microsoft logo: 4-color square + wordmark -->
  <g>
    <!-- Windows icon -->
    <rect x="0" y="0" width="54" height="54" fill="#F25022"/>
    <rect x="58" y="0" width="54" height="54" fill="#7FBA00"/>
    <rect x="0" y="58" width="54" height="54" fill="#00A4EF"/>
    <rect x="58" y="58" width="54" height="54" fill="#FFB900"/>
    <!-- Wordmark -->
    <text x="132" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="400" fill="#737373">Microsoft</text>
  </g>
</svg>